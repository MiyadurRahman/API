<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
button{
    color: red;
}
/* Container Layout */
#post-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px;
    list-style: none;
}

/* Box Card Styling */
.post-card {
    background-color: #ffffff;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
}

/* Hover Effect */
.post-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
}

/* Post ID Badge Style */
.post-id {
    background-color: #e0f2fe;
    color: #0369a1;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    margin-bottom: 10px;
    text-transform: uppercase;
}

/* Title (h1) Style */
.post-title {
    font-size: 1.15rem;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 10px 0;
    text-transform: capitalize;
    line-height: 1.3;
}

/* Body (p) Style */
.post-body {
    font-size: 0.9rem;
    color: #475569;
    margin: 0;
    line-height: 1.5;
}

    </style>
</head>
<body>

    </h1>

</body>

</html>
